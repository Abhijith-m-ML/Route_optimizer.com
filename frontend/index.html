<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polygon points='16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vazhikatti - Smart Route Optimizer. Plan journeys, reorder stops, and optimize your travel routes with real-time distance and time estimates." />
    
    <!-- PWA Web App Manifest & Metadata -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Theme & Status Bar Colors -->
    <meta name="theme-color" content="#020617" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: light)" />
    
    <!-- iOS Web App Presentation -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vazhikatti" />
    <meta name="application-name" content="Vazhikatti" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Early PWA Install Prompt Capture -->
    <script>
      (function() {
        window.__vazhikattiDeferredPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__vazhikattiDeferredPrompt = e;
          window.dispatchEvent(new CustomEvent('vazhikatti:installpromptready'));
        });
        window.addEventListener('appinstalled', function() {
          window.__vazhikattiDeferredPrompt = null;
          window.__vazhikattiInstalled = true;
          window.dispatchEvent(new CustomEvent('vazhikatti:appinstalled'));
        });
      })();
    </script>
    
    <title>Vazhikatti - Route Optimizer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
